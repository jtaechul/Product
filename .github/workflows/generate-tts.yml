name: Generate TTS audio (Jumplish)

# 점프리시 듣기 문항의 음원을 배치로 만들어 브랜치에 커밋한다.
# 개발 샌드박스는 외부망이 막혀 있어 GitHub 러너에서 실행한다 (L1 사진 워크플로와 같은 이유).
#
# 왜 필요한가: 듣기 문항은 음원이 있어야 출제된다. import.mjs 가 음원 없는 듣기 문항을
# draft 로 내리기 때문에, 원고만 써 두면 아이에게 나가지 않는다.
# 이 워크플로가 음원을 만들어 커밋하면 다음 배포 때 저절로 active 가 된다.
#
# 이 저장소의 GitHub 앱 토큰은 workflow_dispatch 호출 권한이 없어(403),
# 이 파일이나 듣기 원고가 푸시될 때 실행되게 한다.
on:
  workflow_dispatch:
    inputs:
      engine:
        description: "음성 엔진 (auto=구글 우선, gemini=강제)"
        type: choice
        options: [auto, gemini]
        default: auto
  push:
    branches: ["claude/junior-toeic-master-planning-322l2t"]
    paths:
      - ".github/workflows/generate-tts.yml"
      - "junior-toeic-master/tools/tts-batch.mjs"
      - "junior-toeic-master/content/questions/L1.json"
      - "junior-toeic-master/content/questions/L2.json"
      - "junior-toeic-master/content/questions/L3.json"
      - "junior-toeic-master/content/questions/L4.json"

permissions:
  contents: write

concurrency:
  group: jumplish-tts
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: junior-toeic-master
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate content
        run: node tools/import.mjs --check

      # 음원 파일 이름은 문항·지문의 ULID(.idmap.json)에서 나온다. 그 매핑이 원고와 함께
      # 커밋돼 있지 않으면, 이 워크플로와 L1 사진 워크플로가 각자 다른 이름을 지어 버린다.
      # 2026-08-11 실제로 겪었다 — 같은 L1 문항 12개에 두 러너가 서로 다른 ULID를 붙였다.
      - name: Check ID map is committed
        run: |
          node tools/import.mjs > /dev/null
          if ! git diff --quiet -- content/.idmap.json; then
            echo "::error::새 문항의 ULID가 러너에서 처음 만들어졌습니다 — 원고와 함께 커밋돼 있어야 합니다."
            echo "::error::개발 폴더에서 'node tools/import.mjs' 를 돌린 뒤 content/.idmap.json 을 문항과 같이 커밋해 주세요."
            exit 1
          fi
          echo "ULID 매핑 확인 — 새로 만들어진 항목 없음"

      # ⚠ 이미 만든 음원을 먼저 옮겨 둔다.
      # tts-batch 는 tools/out/audio 에 파일이 있으면 건너뛰는데, 그 폴더는 gitignore라
      # 러너에는 없다. 이 단계가 없으면 매번 200개를 통째로 다시 만들어 쿼터를 태운다.
      - name: Seed already-made audio (skip regeneration)
        run: |
          mkdir -p tools/out/audio
          if [ -d public/audio ]; then
            cp -r public/audio/. tools/out/audio/
            echo "이미 있는 음원 $(find tools/out/audio -name '*.mp3' | wc -l)개 — 이건 건너뜁니다"
          fi

      - name: Synthesize (resumable)
        id: gen
        continue-on-error: true   # 일부 실패해도 성공분은 커밋한다 (재실행 시 이어서 만듦)
        env:
          # Google Cloud TTS 를 우선 쓴다(기획서에서 고른 엔진 — 미·영·호 성우가 따로 있어
          # 발음이 또렷하고 무료 쿼터도 크다). 없을 때만 Gemini 로 넘어간다.
          # 등록 이름이 조금씩 다를 수 있어 흔한 이름을 모두 받는다.
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CLOUD_TTS_KEY: ${{ secrets.GOOGLE_CLOUD_TTS_KEY }}
          GCP_TTS_KEY: ${{ secrets.GCP_TTS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_JUMPLISH || secrets.GEMINI_API_KEY }}
          ENGINE_CHOICE: ${{ inputs.engine || 'auto' }}
        run: |
          # ULID 매핑은 바로 위 단계에서 확인했다 (파일 이름이 여기에 달려 있다)

          # 어느 이름으로 등록됐는지 찾는다. 값은 절대 찍지 않고 '있다/없다'만 알린다.
          FOUND=""
          for NAME in GOOGLE_TTS_KEY GOOGLE_TTS_API_KEY GOOGLE_API_KEY GOOGLE_CLOUD_TTS_KEY GCP_TTS_KEY; do
            VAL="$(printenv "$NAME" || true)"
            if [ -n "$VAL" ]; then
              echo "찾음: $NAME (길이 ${#VAL}자)"
              FOUND="$VAL"
              break
            else
              echo "없음: $NAME"
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::warning::구글 TTS 키를 어느 이름으로도 찾지 못했습니다."
            echo "::warning::Repository secret 인지(Environment secret 은 이 작업에서 안 보입니다) 확인해 주세요."
          fi

          if [ -n "$FOUND" ] && [ "$ENGINE_CHOICE" != "gemini" ]; then
            echo "엔진: google — 미·영·호 발음이 성우로 고정됩니다"
            GOOGLE_TTS_KEY="$FOUND" TTS_ENGINE=google node tools/tts-batch.mjs
            exit $?
          fi

          # 구글 키가 없으면 Gemini 로 넘어가지 않고 여기서 멈춘다.
          # 실측: Gemini 무료 등급은 분당 요청 수가 낮아 36개에 한 시간이 걸리고 대부분 실패한다.
          # 한 시간을 헛돌리느니 즉시 알려주는 편이 낫다. 정말 Gemini 로 돌리려면
          # Actions 화면에서 engine=gemini 로 수동 실행하면 된다.
          if [ "$ENGINE_CHOICE" != "gemini" ]; then
            echo "::error::구글 TTS 키를 찾지 못했습니다 (위 '없음:' 목록 참고)."
            echo "::error::GitHub > Settings > Secrets and variables > Actions 의"
            echo "::error::'Repository secrets' 에 GOOGLE_TTS_KEY 로 등록해 주세요."
            echo "::error::(Environment secrets 에 넣으면 이 작업에서 보이지 않습니다)"
            echo "::error::Gemini 로 굳이 돌리려면 이 워크플로를 engine=gemini 로 수동 실행하세요."
            exit 1
          fi

          GEM="$(printenv GEMINI_API_KEY || true)"
          if [ -z "$GEM" ]; then
            echo "::error::Gemini 키도 없습니다 — 음원을 만들 수 없습니다"
            exit 1
          fi
          echo "엔진: gemini (직접 고르셨습니다 — 느리고 발음 구분이 약합니다)"
          TTS_ENGINE=gemini node tools/tts-batch.mjs

      - name: Move new audio into public/
        run: |
          mkdir -p public/audio/questions public/audio/passages
          cp -r tools/out/audio/. public/audio/ 2>/dev/null || true
          echo "public/audio 총 $(find public/audio -name '*.mp3' | wc -l)개"

      # 만든 뒤에 실제로 소리가 채워졌는지 센다.
      # import.mjs 는 음원 없는 듣기 문항을 draft 로 내리므로, 그 경고 수가 곧 '아직 소리 없는 문항 수'다.
      - name: Check what is still silent
        run: |
          LEFT=$(node tools/import.mjs --check 2>&1 | grep -c "draft로 내림" || true)
          echo "아직 음원이 없어 출제되지 않는 듣기 문항: ${LEFT}개"
          if [ "$LEFT" -eq 0 ]; then
            echo "모든 듣기 문항에 음원이 있습니다."
          else
            echo "::warning::${LEFT}개는 아직 소리가 없습니다 — 다시 실행하면 이어서 만듭니다"
          fi

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio content/.idmap.json
          if git diff --cached --quiet; then
            echo "새로 만든 음원 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "junior-toeic-master: 듣기 음원 생성·활성화 (자동 배치)" \
            -m "generate-tts.yml 러너에서 배치 TTS로 생성. 음원이 갖춰진 듣기 문항은 다음 배포 때 import.mjs가 draft에서 active로 올린다. 이미 있는 음원은 다시 만들지 않는다."
          # 만드는 동안 브랜치가 앞서갔을 수 있다 — 리베이스로 얹은 뒤 푸시.
          # L1.json 을 고치면 이 워크플로와 L1 사진 워크플로가 함께 돌아 같은 브랜치에 각자 커밋한다.
          # 둘이 동시에 푸시하면 한쪽이 튕기므로, 튕기면 다시 당겨 얹고 재시도한다.
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then exit 0; fi
            echo "다른 작업이 먼저 푸시했습니다 — 다시 얹어 재시도 ${i}/5"
            sleep $((5 * i))
          done
          echo "::error::푸시를 5번 시도했지만 실패했습니다"
          exit 1

      - name: Fail if synthesis incomplete
        if: steps.gen.outcome == 'failure'
        run: |
          echo "::error::일부 음원 생성 실패 — 다시 실행하면 이어서 만듭니다 (이미 만든 건 건너뜀)"
          exit 1
