name: shorts-sourcing

# 틱톡 발굴 (미래마켓 개조 §6) — 키워드로 틱톡 쇼핑 쇼츠 5~10개를 추천 후보로 뽑는다.
# 이 환경은 dispatch API 권한이 없어(403) push 트리거도 지원: requests/sourcing/*.json 을 푸시.
# produce의 requests/*.json 글롭(하위폴더 불매칭)과 충돌 없음.

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "틱톡 검색 키워드"
        default: ""
      url:
        description: "틱톡 URL(주면 키워드 검색 대신 이 영상 하나만)"
        default: ""
      hash:
        description: "상품 row_hash(결과 저장 키)"
        default: "manual"
      limit:
        description: "추천 개수"
        default: "10"
      page:
        description: "새로고침 배치(0=상위, 1=다음…)"
        default: "0"
      nonce:
        description: "폴링 신선도 매칭용"
        default: ""
      terms:
        description: "쉼표구분 검색어(주면 한국어→중국어 확장 생략 · ③ 홍보영상용)"
        default: ""
      cursor:
        description: "tikwm 커서(새로고침 시 이전 next_cursor — 진짜 다음 영상)"
        default: "0"
      exclude:
        description: "쉼표구분 source_url(이미 본 영상 제외)"
        default: ""
  push:
    branches: [main, claude/coupang-shorts-phase-0-k42l1i]
    paths: ["projects/coupang-shorts-factory/requests/sourcing/*.json"]

permissions:
  contents: write

defaults:
  run:
    working-directory: projects/coupang-shorts-factory

jobs:
  discover:
    name: "틱톡 발굴 (tikwm)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # 매니페스트 커밋을 위해 브랜치로 체크아웃(비-detached)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 파라미터 결정 (dispatch 입력 / requests/sourcing/*.json)
        id: p
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            KW='${{ inputs.keyword }}'; HS='${{ inputs.hash }}'; LM='${{ inputs.limit }}'
            PG='${{ inputs.page }}'; NC='${{ inputs.nonce }}'; TM='${{ inputs.terms }}'
            CR='${{ inputs.cursor }}'; EX='${{ inputs.exclude }}'; UR='${{ inputs.url }}'
          else
            f=$(ls -t requests/sourcing/*.json | head -1)
            KW=$(jq -r '.keyword // ""' "$f"); HS=$(jq -r '.hash // "manual"' "$f"); LM=$(jq -r '.limit // 10' "$f")
            PG=$(jq -r '.page // 0' "$f"); NC=$(jq -r '.nonce // ""' "$f"); TM=$(jq -r '.terms // ""' "$f")
            CR=$(jq -r '.cursor // 0' "$f"); EX=$(jq -r '.exclude // ""' "$f"); UR=$(jq -r '.url // ""' "$f")
          fi
          { echo "keyword=$KW"; echo "hash=$HS"; echo "limit=$LM"; echo "page=${PG:-0}"; echo "nonce=$NC"; echo "terms=$TM"; echo "cursor=${CR:-0}"; echo "exclude=$EX"; echo "url=$UR"; } >> "$GITHUB_OUTPUT"

      - name: 발굴 실행 (stdlib만 — 의존성 설치 불필요; Gemini는 번역·중국어확장용, 키 없으면 원문 폴백)
        env:
          SHORTS_GEMINI_API_KEY: ${{ secrets.SHORTS_GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 네이버 쇼핑 검색(진짜 상품명 + 쿠팡 판매여부). 키 없으면 조용히 스킵.
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SHORTS_NAVER_CLIENT_ID: ${{ secrets.SHORTS_NAVER_CLIENT_ID }}
          SHORTS_NAVER_CLIENT_SECRET: ${{ secrets.SHORTS_NAVER_CLIENT_SECRET }}
        run: python -m src.sourcing.discover --keyword "${{ steps.p.outputs.keyword }}" --url "${{ steps.p.outputs.url }}" --hash "${{ steps.p.outputs.hash }}" --limit "${{ steps.p.outputs.limit }}" --page "${{ steps.p.outputs.page }}" --nonce "${{ steps.p.outputs.nonce }}" --terms "${{ steps.p.outputs.terms }}" --cursor "${{ steps.p.outputs.cursor }}" --exclude "${{ steps.p.outputs.exclude }}"

      - name: 추천 매니페스트 커밋 (관리자 카드가 읽음, 실패해도 로그로 확인)
        continue-on-error: true
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add data/sources/discover/*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "sourcing: 틱톡 발굴 결과 커밋 [skip ci]"
          git push || true
