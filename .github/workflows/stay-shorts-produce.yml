name: stay-shorts-produce

# 숙소 쇼핑쇼츠 — 세로 영상 1편을 만든다.
# request.json 의 mode 가 "top3" 면 메인 포맷 「데이터 호캉스 TOP3」(테마 1 · 숙소 3곳 · 25초 · 숙소당 Veo 2컷 + 실촬영 B롤). "fake": true 면 0원 가짜 클립.
# mode 가 "veo" 면 사진 7장(물놀이 3·객실 2·특별 공간 2) → Veo 이미지→영상 7컷 → 이어 붙이기 (단일 숙소)
#   (유료 · 1편 약 2,100원 · 한 번 실행 3,000원 / 한 달 50,000원 한도는 src/veo.py 가 지킨다 · 장부 state/spend.json)
# mode 가 없으면 예전 시험 방식(사진 확대 + 자막, 유료 생성 없음).
# 쿠팡 검색 → 사진 분류·대본(Gemini) → 음성(Gemini) → [Veo] → 합성(ffmpeg).
# 업로드 없음 — 완성본은 Release 와 텔레그램으로만 전달한다 (승인 전 발행 금지).
# 실행: projects/stay-shorts-factory/requests/produce/request.json 을 바꿔 푸시하거나 Run workflow.

on:
  workflow_dispatch: {}
  push:
    branches: ["main", "claude/stay-shorts-factory", "claude/stay-shorts-video-conversion-67hiin"]
    paths: ["projects/stay-shorts-factory/requests/produce/*.json"]

permissions:
  contents: write
  actions: write     # 폴더 데이터가 바뀌면 deploy-stay-links 를 불러 페이지를 다시 배포한다

concurrency:
  group: stay-shorts-produce
  cancel-in-progress: false

jobs:
  produce:
    name: 숙소 영상 1편 제작
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            projects/stay-shorts-factory
            projects/coupang-shorts-factory/assets/fonts
          sparse-checkout-cone-mode: true

      - name: 준비 (Pillow · ffmpeg 확인)
        run: |
          python3 -m pip install -q pillow
          # 러너에 ffmpeg 가 기본으로 없다 (2026-10-09 실측) — 없을 때만 설치한다
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          command -v ffmpeg && ffmpeg -version 2>/dev/null | sed -n '1p'
          # 공식 홈페이지 사진 수집(src/crawl_photos.py)은 러너에 기본 탑재된 크롬으로 페이지를 그린다 — 없으면 쿠팡 사진만 쓴다
          command -v google-chrome >/dev/null && google-chrome --version || echo "크롬 없음 — 공식 홈페이지 사진 수집은 건너뛴다"

      - name: 재사용 클립 내려받기 (이전 실행 아티팩트 · 0원)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          P=projects/stay-shorts-factory
          python3 -c "import json;[print(r['run_id'], r['name']) for r in json.load(open('$P/requests/produce/request.json',encoding='utf-8')).get('reuse_runs') or []]" | while read -r RID NAME; do
            [ -n "$RID" ] || continue
            mkdir -p "$P/build/reuse/$NAME"
            gh run download "$RID" -n "$NAME" -D "$P/build/reuse/$NAME" -R "$GITHUB_REPOSITORY" && echo "내려받음: $NAME ($RID)" || echo "실패(새로 만든다): $NAME ($RID)"
          done
          ls -R "$P/build/reuse" 2>/dev/null | head -40 || true

      - name: 제작
        id: make
        working-directory: projects/stay-shorts-factory
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # 비어 있으면 코드의 기본값(veo-3.1-lite · 3,000원 · 50,000원)을 쓴다. 바꾸려면 저장소 Variables 에 넣는다.
          VEO_MODEL: ${{ vars.STAY_VEO_MODEL }}
          STAY_RUN_KRW: ${{ vars.STAY_RUN_KRW }}
          STAY_MONTH_KRW: ${{ vars.STAY_MONTH_KRW }}
        run: python3 src/make_stay.py

      - name: 완성본을 Release 로 올린다
        if: success()
        # stay-run-10 에서 releases API 가 403(Resource not accessible by integration)을 냈다 — 텔레그램 전달이 본선이므로 Release 실패로 실행을 빨갛게 만들지 않는다
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd projects/stay-shorts-factory/build
          TAG="stay-run-${{ github.run_number }}"
          FILES="meta.json"
          [ -f video.mp4 ] && FILES="$FILES video.mp4"
          # 사진이 든 시트(compare·preview jpg)는 Release 에 올리지 않는다 — 공식 홈페이지 사진 재배포 금지(텔레그램·아티팩트로만)
          for f in preview.md narration_preview.mp3; do [ -f "../data/runs/latest/$f" ] && FILES="$FILES ../data/runs/latest/$f"; done
          gh release create "$TAG" $FILES --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --title "숙소 쇼츠 시험 제작 $TAG" \
            --notes "숙소 쇼핑쇼츠 시험 제작본 (검수용 · 미발행). compare_sheet.jpg = 원본 사진과 AI 영상 첫 장면 비교"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 완성본 보관 (Actions 아티팩트 · 90일) — Release 가 403 일 때의 보관처
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stay-run-${{ github.run_number }}
          path: |
            projects/stay-shorts-factory/build/video.mp4
            projects/stay-shorts-factory/build/meta.json
            projects/stay-shorts-factory/build/narr_full.wav
            projects/stay-shorts-factory/build/mini
            projects/stay-shorts-factory/build/veo_*.mp4
            projects/stay-shorts-factory/data/runs/latest/compare_sheet.jpg
            projects/stay-shorts-factory/data/runs/latest/preview_shots.jpg
            projects/stay-shorts-factory/data/runs/latest/preview_mini.jpg
            projects/stay-shorts-factory/data/runs/latest/preview.md
            projects/stay-shorts-factory/data/runs/latest/narration_preview.mp3
            projects/stay-shorts-factory/data/runs/latest/report.json
          if-no-files-found: ignore
          retention-days: 90

      - name: 텔레그램으로 영상 전달
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ] && { echo "텔레그램 키 없음 — 건너뜀"; exit 0; }
          P=projects/stay-shorts-factory
          [ -f "$P/build/SKIPPED" ] && { cat "$P/build/SKIPPED"; exit 0; }   # 같은 nonce 재실행 — 알림·기록 없음
          V=$P/build/video.mp4
          L=$P/data/runs/latest
          if [ "${{ steps.make.outcome }}" = "success" ] && [ -f "$L/narration_preview.mp3" ] && [ ! -f "$V" ]; then
            # 미리보기 단계: 사진 시트 + 나레이션 음성 + 받아쓰기 판정
            QA=$(python3 -c "import json;r=json.load(open('$L/report.json',encoding='utf-8'));qa=r.get('narration_qa') or [];sq=r.get('screen_qa') or [];sqs=[q for q in sq if q.get('score') is not None];print(('나레이션 받아쓰기 ' + ('전부 통과' if all(q['ok'] for q in qa) else '실패 있음')) + ' · ' + ' / '.join(f\"{q['segment']} {q['similarity']}\" for q in qa) + (f\" · 화면 검수 {sum(1 for q in sqs if q['score']>=q.get('threshold',7))}/{len(sqs)} 통과\" if sqs else ''))" 2>/dev/null || echo "미리보기")
            COST=$(python3 -c "import json;r=json.load(open('$L/report.json',encoding='utf-8'));g=r.get('gemini_usage') or {};print(f\"비용: Veo 0원 · AI 글·음성 추정 {g.get('krw_est',0):,}원({g.get('calls',0)}회)\")" 2>/dev/null || echo "비용: Veo 0원")
            curl -s -o /dev/null -w "telegram photo http %{http_code}\n" -F chat_id="$TG_CHAT" -F photo=@"$L/preview_shots.jpg" \
              -F caption="미리보기(영상 없음) — 숙소별 장면과 자막. $QA · $COST" "https://api.telegram.org/bot$TG_TOKEN/sendPhoto" || true
            curl -s -o /dev/null -w "telegram audio http %{http_code}\n" -F chat_id="$TG_CHAT" -F audio=@"$L/narration_preview.mp3" \
              -F caption="나레이션 미리듣기 (컷 순서: 훅 → 물놀이 2 → 객실 2 → 특별 공간 2 → 조건·추천 2 → 끝 카드)" "https://api.telegram.org/bot$TG_TOKEN/sendAudio" || true
            if [ -f "$L/preview_mini.jpg" ]; then
              MC=$(python3 -c "import json;r=json.load(open('$L/report.json',encoding='utf-8'));m=r.get('mini_pick') or [];ok=[x for x in m if x.get('verdict')=='채택'];print(f\"미니어처 후보 {len(m)}장 중 채택 {len(ok)}컷 (\" + ', '.join(f\"컷 {x['i']} {x['role']}\" for x in ok) + ')')" 2>/dev/null || echo "미니어처 후보 판정")
              curl -s -o /dev/null -w "telegram mini sheet http %{http_code}\n" -F chat_id="$TG_CHAT" -F photo=@"$L/preview_mini.jpg" \
                -F caption="$MC · 노랑 선 = 얼굴 한계(화면 높이 58%, 이 선 위) · 하늘색 = 얼굴 · 빨강 = 자막 띠(몸은 가려져도 됨) · 초록 상자 = 채택, 주황 = 탈락(아래 이유)" "https://api.telegram.org/bot$TG_TOKEN/sendPhoto" || true
            fi
          elif [ "${{ steps.make.outcome }}" = "success" ] && [ -f "$V" ]; then
            CAP=$(python3 - <<'PY' || echo "숙소 쇼츠 시험 제작본입니다 (미발행 · 검수용)"
          import json
          m = json.load(open("projects/stay-shorts-factory/build/meta.json", encoding="utf-8"))
          v = m.get("veo") or {}
          s = {"veo": "Veo 7컷 방식", "top3": "TOP3", "solo": "단일 숙소 Veo"}.get(m.get("mode"), "사진 확대 방식") + f" · {m.get('stay')} · {m.get('duration_sec')}초"
          if v:
              s += f" · 클립 {v.get('clips_ok')}/{v.get('clips_total')} · Veo 이번 실행 약 {v.get('spent_krw', 0):,}원 · 이번 달 누적 {v.get('month_total_krw', 0):,}원"
          g = m.get("gemini_usage") or {}
          if g:
              s += f" · AI 글·음성 추정 {g.get('krw_est', 0):,}원"
          print(s + " (미발행 · 검수용)")
          PY
          )
            curl -s -o /dev/null -w "telegram video http %{http_code}\n" -F chat_id="$TG_CHAT" -F video=@"$V" \
              -F caption="$CAP" "https://api.telegram.org/bot$TG_TOKEN/sendVideo" || true
            S=$P/data/runs/latest/compare_sheet.jpg
            if [ -f "$S" ]; then
              curl -s -o /dev/null -w "telegram photo http %{http_code}\n" -F chat_id="$TG_CHAT" -F photo=@"$S" \
                -F caption="왼쪽 원본 사진 · 오른쪽 AI 영상 첫 장면. 실제와 다른 시설·전망이 보이면 폐기합니다" \
                "https://api.telegram.org/bot$TG_TOKEN/sendPhoto" || true
            fi
          else
            ERR=$(python3 -c "import json;r=json.load(open('$P/data/runs/latest/report.json',encoding='utf-8'));v=r.get('veo')or{};print(str(r.get('error',''))[:220]+(f\"  / 이번 실행 영상값 약 {v.get('spent_krw',0):,}원\" if v else ''))" 2>/dev/null || echo "기록을 확인합니다")
            curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=숙소 쇼츠 시험 제작 실패 — $ERR" || true
          fi
          # 공식 홈페이지에서 모은 사진 전체(숙소별 한 장) — 검수용. 텔레그램으로만 보내고 저장소·Release 에는 올리지 않는다 (재배포 방지)
          for s in $P/build/h*/official/sheet.jpg $P/build/official/sheet.jpg; do
            [ -f "$s" ] || continue
            NAME=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1],encoding='utf-8')).get('name',''))" "$(dirname "$s")/photo_sources.json" 2>/dev/null || echo "")
            curl -s -o /dev/null -w "telegram official sheet http %{http_code}\n" -F chat_id="$TG_CHAT" -F photo=@"$s" \
              -F caption="$NAME — 공식 홈페이지에서 모은 사진 전체 (검수용 · 다른 숙소 사진이 섞였는지 확인)" "https://api.telegram.org/bot$TG_TOKEN/sendPhoto" || true
          done

      - name: 기록·미리보기·장부 커밋 (영상은 커밋하지 않는다)
        if: always()
        run: |
          P=projects/stay-shorts-factory
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # stay-run-18 실측: 실행 중에 다른 푸시가 들어오면 pull --rebase 가 충돌(report·장부·폴더) → 기록·Veo 장부가 통째로 유실됐다.
          # 그래서 이 실행의 결과 파일을 따로 보관했다가, 원격 최신 위에 **덮어쓰는** 방식으로 커밋한다 (충돌 없음).
          # 이 실행이 시작할 때의 요청 nonce(돈 잠금 전에 멈춘 실행·취소된 실행도 잠그려고 — produce_nonce 는 돈 잠금 뒤에만 적힌다)
          export STARTED=$(python3 -c "import json;print(json.load(open('$P/requests/produce/request.json',encoding='utf-8')).get('nonce',''))" 2>/dev/null || true)
          SAVE=$(mktemp -d)
          for d in data/runs state link; do [ -e "$P/$d" ] && { mkdir -p "$SAVE/$(dirname "$d")"; cp -r "$P/$d" "$SAVE/$d"; }; done
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}" || { sleep 3; continue; }
            for d in data/runs state link; do [ -e "$SAVE/$d" ] && { mkdir -p "$P/$d"; cp -a "$SAVE/$d/." "$P/$d/"; }; done
            # 2026-10-14 관리실: 실행이 끝나면 요청을 자동으로 잠근다(stage 제거 · veo_approved false · 재사용 전용 해제).
            # 원격 요청의 nonce 가 방금 돈 nonce 와 같을 때만 — 그사이 새로 들어온 요청은 건드리지 않는다
            python3 - "$P" <<'PY' || echo "요청 잠금 건너뜀"
          import json, os, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          ran = os.environ.get("STARTED") or json.loads((p / "state/produce_nonce.json").read_text(encoding="utf-8")).get("nonce")
          rq = p / "requests/produce/request.json"
          r = json.loads(rq.read_text(encoding="utf-8"))
          if ran and r.get("nonce") == ran and (r.get("stage") or r.get("veo_approved") or r.get("reuse_only")):
              r.pop("stage", None); r.pop("reuse_only", None); r["veo_approved"] = False
              r["note"] = f"잠금(자동 · 실행 끝): {ran}"
              rq.write_text(json.dumps(r, ensure_ascii=False, indent=1) + "\n", encoding="utf-8")
              print("요청 잠금:", ran)
          PY
            git add "$P/data/runs" "$P/state" "$P/link" "$P/requests/produce/request.json" 2>/dev/null || true
            if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
            FOLDER_CHANGED=0; git diff --cached --quiet -- "$P/link" || FOLDER_CHANGED=1
            git commit -q -m "stay-shorts: 시험 제작 기록 [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "저장 완료"; echo "FOLDER_CHANGED=$FOLDER_CHANGED" >> "$GITHUB_ENV"; exit 0; fi
            echo "재시도 $i (원격이 바뀜)"; sleep 3
          done
          echo "::error::기록 저장 실패 — 결과는 텔레그램·Release 에만 남았다"; exit 1

      - name: 폴더 페이지 재배포 (폴더 데이터가 바뀐 경우)
        if: always() && env.FOLDER_CHANGED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 위 커밋은 [skip ci] 라 push 트리거가 안 걸린다 → 배포 워크플로를 직접 부른다
          gh workflow run deploy-stay-links.yml --ref "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" && echo "deploy-stay-links 호출" || echo "::warning::배포 워크플로 호출 실패 — link/ 변경을 푸시하면 자동 배포된다"
