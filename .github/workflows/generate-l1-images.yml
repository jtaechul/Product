name: Generate L1 images (Jumplish)

# 점프리시 L1(사진 고르기) 보기 사진 4컷×8문항을 픽사베이에서 검색·내려받아
# 브랜치에 커밋한다. 개발 샌드박스는 외부망이 막혀 있어 GitHub 러너에서 실행한다.
# (AI 생성 그림은 상황이 자주 틀려서 폐기 — 실제 사진 + 태그 검사로 바꿨다)
# 사진만 붙인다 — 출제(active)는 관리자가 미리보기로 사진을 보고 '출제 시작'을 눌러야 한다.
# 사진을 커밋하면 아래 deploy 잡이 이어서 배포한다.

# 이 저장소의 GitHub 앱 토큰은 workflow_dispatch 호출 권한이 없어(403),
# 이 파일 자체가 푸시될 때 실행되게 한다. (러너가 푸시하는 이미지 커밋은
# GITHUB_TOKEN 푸시라 어떤 워크플로도 다시 깨우지 않는다 — 무한루프 없음)
on:
  # 문항 생성(generate-questions.yml)이 새 L1 초안을 만든 뒤 사진까지 이어 붙이려고 부른다.
  # 러너가 GITHUB_TOKEN 으로 한 푸시는 아래 push 트리거를 깨우지 못한다(깃허브 정책).
  # 이게 빠져 있어서 AI 가 만든 L1 초안 6개(2026-09-19)가 사진 없이 계속 쌓여만 있었다.
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["claude/junior-toeic-master-planning-322l2t"]
    paths:
      - ".github/workflows/generate-l1-images.yml"
      - "junior-toeic-master/tools/img-batch.mjs"          # 수집 방식 변경 시 자동 재수집
      - "junior-toeic-master/content/questions/L1.json"    # 검색 조건을 고치면 그 컷을 다시 받는다

permissions:
  contents: write

concurrency:
  group: jumplish-l1-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # 실제로 새 파일을 커밋·푸시했을 때만 아래 deploy 를 부른다
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    defaults:
      run:
        working-directory: junior-toeic-master
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠ 트리거된 커밋이 아니라 브랜치의 최신 상태를 받는다. generate-questions.yml 이
          # uses: 로 부를 때 github.sha 는 주문서 커밋이라 방금 만든 L1 초안이 들어 있지 않다
          # (generate-tts.yml 이 같은 함정에 빠졌었다 — 그쪽 주석 참고).
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate content
        run: node tools/import.mjs --check

      # 만드는 파일 이름은 문항의 ULID(.idmap.json)에서 나온다. 그 매핑이 원고와 함께
      # 커밋돼 있지 않으면, 음원 워크플로와 사진 워크플로가 각자 다른 이름을 지어 버린다.
      # 2026-08-11 실제로 겪었다 — 같은 L1 문항 12개에 두 러너가 서로 다른 ULID를 붙여
      # 애써 받은 사진 48컷이 문항과 짝을 잃을 뻔했다. 그래서 여기서 먼저 막는다.
      - name: Check ID map is committed
        run: |
          node tools/import.mjs > /dev/null
          if ! git diff --quiet -- content/.idmap.json; then
            echo "::error::새 문항의 ULID가 러너에서 처음 만들어졌습니다 — 원고와 함께 커밋돼 있어야 합니다."
            echo "::error::개발 폴더에서 'node tools/import.mjs' 를 돌린 뒤 content/.idmap.json 을 문항과 같이 커밋해 주세요."
            exit 1
          fi
          echo "ULID 매핑 확인 — 새로 만들어진 항목 없음"

      - name: Fetch photos (resumable)
        id: gen
        continue-on-error: true   # 일부 실패해도 성공분은 커밋한다 (재실행 시 이어서 받음)
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node tools/img-batch.mjs

      - name: Commit & push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # .idmap.json 도 함께 담는다. import.mjs 가 이 파일을 다시 쓰기 때문에,
          # 빼 두면 '커밋 안 된 변경'이 남아 아래 pull --rebase 가 통째로 거부된다.
          git add public/img/l1 content/l1-photos.json content/.idmap.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "junior-toeic-master: L1 보기 사진 수집 (자동 배치)" \
            -m "generate-l1-images.yml 러너에서 픽사베이 검색으로 수집. 태그 조건(need/avoid)을 통과한 사진만 채택한다. 출제 여부는 바꾸지 않는다 — 관리자 화면에서 사진을 확인하고 '출제 시작'을 눌러야 아이에게 나간다. 출처는 content/l1-photos.json에 기록."
          # 생성하는 동안 브랜치가 앞서갔을 수 있다 — 리베이스로 얹은 뒤 푸시.
          # L1.json 을 고치면 이 워크플로와 TTS 워크플로가 함께 돌아 같은 브랜치에 각자 커밋한다.
          # 둘이 동시에 푸시하면 한쪽이 튕기므로, 튕기면 다시 당겨 얹고 재시도한다.
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "다른 작업이 먼저 푸시했습니다 — 다시 얹어 재시도 ${i}/5"
            sleep $((5 * i))
          done
          echo "::error::푸시를 5번 시도했지만 실패했습니다"
          exit 1

      - name: Fail if generation incomplete
        if: steps.gen.outcome == 'failure'
        run: |
          echo "::error::일부 사진 수집 실패 — 검색어를 손보고 다시 실행하면 이어서 받습니다"
          exit 1

  # 사진을 커밋했으면 곧바로 배포까지 이어 준다 (generate-tts.yml 과 같은 이유).
  deploy:
    needs: generate
    if: ${{ !cancelled() && needs.generate.outputs.pushed == 'true' }}
    uses: ./.github/workflows/deploy-jumplish.yml
    secrets: inherit
