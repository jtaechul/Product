name: Shorts Studio - 비밀값 자동 반영

# GitHub 시크릿(비밀번호·토큰)을 고쳐도 그것만으로는 관리자 페이지에 전달되지 않는다.
# 예전에는 사람이 배포를 다시 돌려야 했는데, 그걸 모르면 "비밀번호를 바꿨는데 안 들어가진다"가
# 된다. 그래서 15분마다 알아서 밀어 넣는다. 급하면 아래 Run workflow 로 즉시 반영한다.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: shorts-studio-secrets
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    name: 비밀값 반영
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shorts_studio/admin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: 열쇠 확인
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF" ]; then
            echo "::error::CF_API_TOKEN 이 없습니다. 관리자 페이지에 비밀값을 넣을 수 없습니다."
            exit 1
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CF" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          if [ "$CODE" != "200" ]; then
            echo "::error::CF_API_TOKEN 이 만료됐거나 잘못됐습니다(HTTP $CODE). 새로 만들어 등록하세요."
            exit 1
          fi

      - name: 워커에 비밀값 밀어 넣기
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEC_GH_TOKEN: ${{ secrets.MOVIEGEN_ADMIN_GH_TOKEN }}
          SEC_ADMIN_PASSWORD: ${{ secrets.MOVIEGEN_ADMIN_PASSWORD }}
          SEC_SESSION_SECRET: ${{ secrets.MOVIEGEN_SESSION_SECRET || secrets.MOVIEGEN_ADMIN_PASSWORD }}
          SEC_KEY_SECRET: ${{ secrets.MOVIEGEN_KEY_SECRET || secrets.MOVIEGEN_SESSION_SECRET || secrets.MOVIEGEN_ADMIN_PASSWORD }}
          USERS_JSON: ${{ secrets.MOVIEGEN_USERS }}
          U1: ${{ secrets.MOVIEGEN_USER_1 }}
          U2: ${{ secrets.MOVIEGEN_USER_2 }}
          U3: ${{ secrets.MOVIEGEN_USER_3 }}
          U4: ${{ secrets.MOVIEGEN_USER_4 }}
          U5: ${{ secrets.MOVIEGEN_USER_5 }}
          U6: ${{ secrets.MOVIEGEN_USER_6 }}
          U7: ${{ secrets.MOVIEGEN_USER_7 }}
          U8: ${{ secrets.MOVIEGEN_USER_8 }}
        run: bash put_secrets.sh

      - name: 안내
        if: always()
        run: |
          {
            echo "## 관리자 페이지 비밀값 반영"
            echo ""
            echo "15분마다 자동으로 돕니다. 비밀번호를 바꾸셨다면 늦어도 15분 안에 반영됩니다."
            echo ""
            echo "**지금 바로** 반영하려면 이 화면 오른쪽 위 **Run workflow** 를 누르십시오."
          } >> "$GITHUB_STEP_SUMMARY"
