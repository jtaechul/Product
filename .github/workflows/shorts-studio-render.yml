name: Shorts Studio - 영상 렌더링

# ② 업로드된 씬 영상 + 대본 → 나레이션·가라오케 자막 → 최종 MP4 → Release 업로드.
# 씬 영상은 관리자 페이지가 릴리스 moviegen-<id> 에 scene01.mp4 형태로 올려 둔다.
on:
  workflow_dispatch:
    inputs:
      content_id:
        description: "작품 아이디 (예: 260920-071530)"
        required: true
        type: string
      engine:
        description: "성우 엔진 (gemini = 감정 연기)"
        required: false
        default: "gemini"
        type: choice
        options: ["gemini", "edge"]
      voice:
        description: "성우 (gemini: Sulafat/Kore/Aoede/Leda/Charon/Enceladus)"
        required: false
        default: "Sulafat"
        type: string
      rate:
        description: "말하기 속도 (edge 엔진 전용, 예: -5%)"
        required: false
        default: "-5%"
        type: string
      highlight:
        description: "자막 하이라이트 색"
        required: false
        default: "노란색"
        type: choice
        options: ["노란색", "연두색", "하늘색", "분홍색"]
      tts_gap:
        description: "Gemini 성우 호출 사이 간격(초). 분당 제한에 걸리면 올린다"
        required: false
        default: "1.0"
        type: string
      band_top:
        description: "위 검은 띠 두께 (화면 높이 비율, 0 이면 없음)"
        required: false
        default: "0.08"
        type: string
      band_bottom:
        description: "아래 검은 띠 두께 — 워터마크를 덮는 쪽이라 더 두껍다 (0.16 권장)"
        required: false
        default: "0.16"
        type: string
      cover_sec:
        description: "표지가 뜨는 시간(초). 0 이면 표지를 넣지 않음"
        required: false
        default: "1.8"
        type: string
      gemini_key_enc:
        description: "봉해진 개인 API 키 (관리자 페이지가 넣습니다 · 사람이 쓰지 마세요)"
        required: false
        default: ""
        type: string
      hq:
        description: "고화질 1080x1920 (느림)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: shorts-studio-render-${{ inputs.content_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    name: 렌더링
    timeout-minutes: 90   # 20컷이면 클립 20개를 받아 변환하고 전환까지 걸어야 한다
    defaults:
      run:
        working-directory: shorts_studio
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: ffmpeg·한글 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-nanum fonts-nanum-extra
          fc-cache -f

      - run: pip install --quiet "edge-tts>=7.0" "cryptography>=42.0"

      - name: 렌더링
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEY_ENC: ${{ inputs.gemini_key_enc }}
          KEY_SECRET: ${{ secrets.MOVIEGEN_KEY_SECRET || secrets.MOVIEGEN_SESSION_SECRET || secrets.MOVIEGEN_ADMIN_PASSWORD }}
          CONTENT_ID: ${{ inputs.content_id }}
          TTS_ENGINE: ${{ inputs.engine }}
          VOICE: ${{ inputs.voice }}
          RATE: ${{ inputs.rate }}
          HIGHLIGHT: ${{ inputs.highlight }}
          TTS_GAP: ${{ inputs.tts_gap }}
          BAND_TOP: ${{ inputs.band_top }}
          BAND_BOTTOM: ${{ inputs.band_bottom }}
          COVER_SEC: ${{ inputs.cover_sec }}
          HQ: ${{ inputs.hq }}
        run: python run_render.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "shorts_studio: 렌더링 완료 (${{ inputs.content_id }})"
          git push
