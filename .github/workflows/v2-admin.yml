name: V2 Admin
# 실행 목록에서 어떤 편·어떤 버튼인지 보이게(관리자 페이지 진행 확인용)
run-name: "v2 ${{ inputs.action }} ${{ inputs.pilot }} ${{ inputs.stage }}"

# 제작 체계 v2 — 관리자 페이지 버튼 실행기(운영자 확정 2026-09-27).
# 관리자 페이지(shorts-dashboard)의 승인·수정 요청·다시 하기·"이 컷만 다시 만들기"·새 영상 시작 버튼이
# 이 워크플로를 디스패치한다 → short-movie-generator/v2/tools/admin.py 실행 → status.json 등을 커밋.
# 입력값은 셸에 직접 치환하지 않고 env 로만 넘긴다(인용부호 소실·주입 방지 — 기존 실사고 규칙).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "new | approve | revise | redo | ready | redo_cut | assemble | topics | edit_line | apply_lines | crosscheck | recut_plan | recut_approve | recut_cancel | upload_meta | save_meta | write_script"
        required: true
      pilot:
        description: "편 id (예: bathynomus_giganteus)"
        required: false
        default: ""
      stage:
        description: "topic | script | storyboard | video | upload (컷 재생성이면 컷 번호)"
        required: false
        default: ""
      note:
        description: "메모(수정 요청 내용 등)"
        required: false
        default: ""

concurrency:
  group: v2-admin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: short-movie-generator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: 준비
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q Pillow numpy google-genai janome google-auth google-auth-oauthlib google-api-python-client

      - name: 버튼 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          IN_ACTION: ${{ inputs.action }}
          IN_PILOT: ${{ inputs.pilot }}
          IN_STAGE: ${{ inputs.stage }}
          IN_NOTE: ${{ inputs.note }}
        run: |
          set -e
          # ★긴 작업(대본 자동 작성) 전에 '진행 중' 기록을 먼저 커밋한다 → 페이지는 실제로 돌 때만 '작업 중'을 보여 준다
          #   (실사고 2026-09-30: 새 편 시작 후 대본 단계가 '작업 중'인데 실제로 대본을 쓰는 작업이 없었음)
          commit_push() {
            git add v2/pilots v2/topics.json v2/topic_media.json || true
            if git diff --cached --quiet; then return 0; fi
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "$1"
            for i in 1 2 3 4 5; do
              git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin HEAD:"$GITHUB_REF_NAME" && return 0
              sleep $((i*3))
            done
            return 1
          }
          write_script() {                       # $1 = 수정 요청 메모(없으면 새로 쓰기)
            python3 v2/tools/admin.py job_start "$IN_PILOT" script "대본 자동 작성 중 — 출처 수집 → 사실 추출 → 대본 → 검증 → 미리듣기"
            commit_push "chore(v2): 대본 자동 작성 시작 $IN_PILOT [skip ci]"
            python3 v2/tools/admin.py write_script "$IN_PILOT" "$1"
          }
          case "$IN_ACTION" in
            new)                        python3 v2/tools/admin.py new "$IN_PILOT"; write_script "" ;;
            write_script)               write_script "$IN_NOTE" ;;
            assemble|apply_lines|sync|crosscheck|upload_meta) python3 v2/tools/admin.py "$IN_ACTION" "$IN_PILOT" ;;
            topics)                     python3 v2/tools/admin.py topics ;;
            revise|redo)
                                        python3 v2/tools/admin.py "$IN_ACTION" "$IN_PILOT" "$IN_STAGE" "$IN_NOTE"
                                        if [ "$IN_STAGE" = "script" ]; then     # 대본 수정 요청·다시 하기 = 실제로 다시 쓴다
                                          if [ "$IN_ACTION" = "revise" ]; then write_script "$IN_NOTE"; else write_script ""; fi
                                        fi ;;
            approve|ready|redo_cut|edit_line|recut_plan|recut_approve|recut_cancel|save_meta)
                                        python3 v2/tools/admin.py "$IN_ACTION" "$IN_PILOT" "$IN_STAGE" "$IN_NOTE" ;;
            *) echo "모르는 동작: $IN_ACTION"; exit 1 ;;
          esac

      - name: 실패 기록
        if: failure()
        env:
          IN_ACTION: ${{ inputs.action }}
          IN_PILOT: ${{ inputs.pilot }}
        run: |
          [ -n "$IN_PILOT" ] && python3 v2/tools/admin.py job_fail "$IN_PILOT" "$IN_ACTION" || true

      - name: 결과 커밋
        if: always()
        env:
          IN_ACTION: ${{ inputs.action }}
          IN_PILOT: ${{ inputs.pilot }}
          IN_STAGE: ${{ inputs.stage }}
        run: |
          git add v2/pilots v2/topics.json v2/topic_media.json || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(v2): 관리자 페이지 $IN_ACTION $IN_PILOT $IN_STAGE [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && break
            sleep $((i*3))
          done
