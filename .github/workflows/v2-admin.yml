name: V2 Admin
# 실행 목록에서 어떤 편·어떤 버튼인지 보이게(관리자 페이지 진행 확인용)
run-name: "v2 ${{ inputs.action }} ${{ inputs.pilot }} ${{ inputs.stage }}"

# 제작 체계 v2 — 관리자 페이지 버튼 실행기(운영자 확정 2026-09-27).
# 관리자 페이지(shorts-dashboard)의 승인·수정 요청·다시 하기·"이 컷만 다시 만들기"·새 영상 시작 버튼이
# 이 워크플로를 디스패치한다 → short-movie-generator/v2/tools/admin.py 실행 → status.json 등을 커밋.
# 입력값은 셸에 직접 치환하지 않고 env 로만 넘긴다(인용부호 소실·주입 방지 — 기존 실사고 규칙).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "new | approve | revise | redo | ready | redo_cut | redo_panel | assemble | topics | edit_line | apply_lines | crosscheck | recut_plan | recut_approve | recut_cancel | upload_meta | save_meta | save_viewed | write_script | write_storyboard | make_video | edit_hook | stats"
        required: true
      pilot:
        description: "편 id (예: bathynomus_giganteus)"
        required: false
        default: ""
      stage:
        description: "topic | script | storyboard | video | upload (컷 재생성이면 컷 번호)"
        required: false
        default: ""
      note:
        description: "메모(수정 요청 내용 등)"
        required: false
        default: ""

concurrency:
  group: v2-admin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: short-movie-generator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # ★실사고 2026-09-30: 버튼(11:14:58) → '진행 중' 기록(11:16:08)까지 70초 동안 페이지가 "돌고 있는 작업이 없습니다"를 보였다
      #   (ffmpeg·pip 설치를 먼저 하느라). → 설치 **전에** 상태를 바꾸고 '진행 중'을 커밋한다(표준 라이브러리만 쓰는 명령이라 설치 불필요).
      - name: 진행 중 먼저 기록
        env:
          IN_ACTION: ${{ inputs.action }}
          IN_PILOT: ${{ inputs.pilot }}
          IN_STAGE: ${{ inputs.stage }}
          IN_NOTE: ${{ inputs.note }}
        run: |
          set -e
          JOB=""
          case "$IN_ACTION" in
            new)             python3 v2/tools/admin.py new "$IN_PILOT"; JOB=script ;;
            write_script)    JOB=script ;;
            write_storyboard) JOB=storyboard ;;
            make_video)      JOB=video ;;
            redo_panel)      JOB=storyboard ;;
            approve)         case "$IN_STAGE" in           # 대본 승인 → 스토리보드 자동 · 콘티 승인 → 영상 자동(운영자 지시 2026-09-30)
                               script)     python3 v2/tools/admin.py approve "$IN_PILOT" script "$IN_NOTE"; JOB=storyboard ;;
                               storyboard) python3 v2/tools/admin.py approve "$IN_PILOT" storyboard "$IN_NOTE"; JOB=video ;;
                               video)      python3 v2/tools/admin.py approve "$IN_PILOT" video "$IN_NOTE"   # 키 불필요 → 설치 전에 바로 반영(약 20초)
                                           bash v2/tools/ci_commit.sh "chore(v2): 승인 video $IN_PILOT [skip ci]" ;;
                             esac ;;                        # upload 승인은 키가 필요해 '버튼 실행' 단계에서(video 는 거기서 다시 불려도 이미 승인 → 그대로)
            revise|redo)     case "$IN_STAGE" in
                               script|storyboard|video) python3 v2/tools/admin.py "$IN_ACTION" "$IN_PILOT" "$IN_STAGE" "$IN_NOTE"; JOB="$IN_STAGE" ;;
                             esac ;;
          esac
          if [ -n "$JOB" ]; then
            python3 v2/tools/admin.py job_start "$IN_PILOT" "$JOB" "자동 작업 시작 — 준비 중(도구 설치 뒤 바로 시작)"
            bash v2/tools/ci_commit.sh "chore(v2): 자동 작업 시작 $JOB $IN_PILOT [skip ci]"
          fi

      - name: 준비
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q Pillow numpy fonttools google-genai janome google-auth google-auth-oauthlib google-api-python-client

      # ★이 단계에만 API 키가 있다(실사고 2026-09-30 run #14: 편집 실수로 이 단계 머리(env)가 지워져 "GEMINI_API_KEY 없음"으로 실패)
      #   → tests/test_v2_admin.py::test_workflow_has_secrets_and_setup 이 워크플로 구조를 검사한다.
      - name: 버튼 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          IN_ACTION: ${{ inputs.action }}
          IN_PILOT: ${{ inputs.pilot }}
          IN_STAGE: ${{ inputs.stage }}
          IN_NOTE: ${{ inputs.note }}
        run: |
          set -e
          case "$IN_ACTION" in
            new|write_script)  python3 v2/tools/admin.py write_script "$IN_PILOT" "$IN_NOTE" ;;
            write_storyboard)  python3 v2/tools/admin.py write_storyboard "$IN_PILOT" "$IN_NOTE" ;;
            make_video)        python3 v2/tools/admin.py make_video "$IN_PILOT" "$IN_NOTE" ;;
            approve)           case "$IN_STAGE" in           # 승인 자체는 앞 단계에서 끝났고, 여기서 다음 단계를 실제로 만든다
                                 script)     python3 v2/tools/admin.py write_storyboard "$IN_PILOT" ;;
                                 storyboard) python3 v2/tools/admin.py make_video "$IN_PILOT" ;;
                                 *)          python3 v2/tools/admin.py approve "$IN_PILOT" "$IN_STAGE" "$IN_NOTE" ;;
                               esac ;;
            revise|redo)       M=""; [ "$IN_ACTION" = "revise" ] && M="$IN_NOTE"
                               case "$IN_STAGE" in           # 수정 요청·다시 하기 = 그 단계를 실제로 다시 만든다
                                 script)     python3 v2/tools/admin.py write_script "$IN_PILOT" "$M" ;;
                                 storyboard) python3 v2/tools/admin.py write_storyboard "$IN_PILOT" "$M" ;;
                                 video)      python3 v2/tools/admin.py make_video "$IN_PILOT" "$M" ;;
                                 *)          python3 v2/tools/admin.py "$IN_ACTION" "$IN_PILOT" "$IN_STAGE" "$IN_NOTE" ;;
                               esac ;;
            assemble|apply_lines|sync|crosscheck|upload_meta|stats) python3 v2/tools/admin.py "$IN_ACTION" "$IN_PILOT" ;;
            topics)            python3 v2/tools/admin.py topics ;;
            ready|redo_cut|redo_panel|edit_line|edit_hook|recut_plan|recut_approve|recut_cancel|save_meta|save_viewed)
                               python3 v2/tools/admin.py "$IN_ACTION" "$IN_PILOT" "$IN_STAGE" "$IN_NOTE" ;;
            *) echo "모르는 동작: $IN_ACTION"; exit 1 ;;
          esac

      - name: 실패 기록
        if: failure()
        env:
          IN_ACTION: ${{ inputs.action }}
          IN_PILOT: ${{ inputs.pilot }}
        run: |
          [ -n "$IN_PILOT" ] && python3 v2/tools/admin.py job_fail "$IN_PILOT" "$IN_ACTION" || true

      - name: 결과 커밋
        if: always()
        env:
          IN_ACTION: ${{ inputs.action }}
          IN_PILOT: ${{ inputs.pilot }}
          IN_STAGE: ${{ inputs.stage }}
        run: |
          git add v2/pilots v2/topics.json v2/topic_media.json || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(v2): 관리자 페이지 $IN_ACTION $IN_PILOT $IN_STAGE [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && break
            sleep $((i*3))
          done
