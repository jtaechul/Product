name: V2 Admin
# 실행 목록에서 어떤 편·어떤 버튼인지 보이게(관리자 페이지 진행 확인용)
run-name: "v2 ${{ inputs.action }} ${{ inputs.pilot }} ${{ inputs.stage }}"

# 제작 체계 v2 — 관리자 페이지 버튼 실행기(운영자 확정 2026-09-27).
# 관리자 페이지(shorts-dashboard)의 승인·수정 요청·다시 하기·"이 컷만 다시 만들기"·새 영상 시작 버튼이
# 이 워크플로를 디스패치한다 → short-movie-generator/v2/tools/admin.py 실행 → status.json 등을 커밋.
# 입력값은 셸에 직접 치환하지 않고 env 로만 넘긴다(인용부호 소실·주입 방지 — 기존 실사고 규칙).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "new | approve | revise | redo | ready | redo_cut | assemble | topics | edit_line | apply_lines | crosscheck | recut_plan | recut_approve | recut_cancel | upload_meta | save_meta | write_script"
        required: true
      pilot:
        description: "편 id (예: bathynomus_giganteus)"
        required: false
        default: ""
      stage:
        description: "topic | script | storyboard | video | upload (컷 재생성이면 컷 번호)"
        required: false
        default: ""
      note:
        description: "메모(수정 요청 내용 등)"
        required: false
        default: ""

concurrency:
  group: v2-admin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: short-movie-generator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # ★실사고 2026-09-30: 버튼(11:14:58) → '진행 중' 기록(11:16:08)까지 70초 동안 페이지가 "돌고 있는 작업이 없습니다"를 보였다
      #   (ffmpeg·pip 설치를 먼저 하느라). → 설치 **전에** 상태를 바꾸고 '진행 중'을 커밋한다(표준 라이브러리만 쓰는 명령이라 설치 불필요).
      - name: 진행 중 먼저 기록
        env:
          IN_ACTION: ${{ inputs.action }}
          IN_PILOT: ${{ inputs.pilot }}
          IN_STAGE: ${{ inputs.stage }}
          IN_NOTE: ${{ inputs.note }}
        run: |
          set -e
          SCRIPT_JOB=""
          case "$IN_ACTION" in
            new)          python3 v2/tools/admin.py new "$IN_PILOT"; SCRIPT_JOB=1 ;;
            write_script) SCRIPT_JOB=1 ;;
            revise|redo)  if [ "$IN_STAGE" = "script" ]; then
                            python3 v2/tools/admin.py "$IN_ACTION" "$IN_PILOT" "$IN_STAGE" "$IN_NOTE"; SCRIPT_JOB=1
                          fi ;;
          esac
          if [ -n "$SCRIPT_JOB" ]; then
            python3 v2/tools/admin.py job_start "$IN_PILOT" script "대본 자동 작성 중 — 준비 → 출처 수집 → 사실 추출 → 대본 → 검증 → 미리듣기"
            bash v2/tools/ci_commit.sh "chore(v2): 대본 자동 작성 시작 $IN_PILOT [skip ci]"
          fi

      - name: 준비
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q Pillow numpy google-genai janome google-auth google-auth-oauthlib google-api-python-client

      - name: 버튼 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          IN_ACTION: ${{ inputs.action }}
          IN_PILOT: ${{ inputs.pilot }}
          IN_STAGE: ${{ inputs.stage }}
          IN_NOTE: ${{ inputs.note }}
        run: |
          set -e
          case "$IN_ACTION" in
            new)                        python3 v2/tools/admin.py write_script "$IN_PILOT" ;;      # 새 편 생성·진행 중 기록은 앞 단계에서
            write_script)               python3 v2/tools/admin.py write_script "$IN_PILOT" "$IN_NOTE" ;;
            assemble|apply_lines|sync|crosscheck|upload_meta) python3 v2/tools/admin.py "$IN_ACTION" "$IN_PILOT" ;;
            topics)                     python3 v2/tools/admin.py topics ;;
            revise|redo)
                                        if [ "$IN_STAGE" = "script" ]; then     # 대본 수정 요청·다시 하기 = 실제로 다시 쓴다(상태는 앞 단계에서 바꿈)
                                          if [ "$IN_ACTION" = "revise" ]; then python3 v2/tools/admin.py write_script "$IN_PILOT" "$IN_NOTE"
                                          else python3 v2/tools/admin.py write_script "$IN_PILOT"; fi
                                        else python3 v2/tools/admin.py "$IN_ACTION" "$IN_PILOT" "$IN_STAGE" "$IN_NOTE"; fi ;;
            approve|ready|redo_cut|edit_line|recut_plan|recut_approve|recut_cancel|save_meta)
                                        python3 v2/tools/admin.py "$IN_ACTION" "$IN_PILOT" "$IN_STAGE" "$IN_NOTE" ;;
            *) echo "모르는 동작: $IN_ACTION"; exit 1 ;;
          esac

      - name: 실패 기록
        if: failure()
        env:
          IN_ACTION: ${{ inputs.action }}
          IN_PILOT: ${{ inputs.pilot }}
        run: |
          [ -n "$IN_PILOT" ] && python3 v2/tools/admin.py job_fail "$IN_PILOT" "$IN_ACTION" || true

      - name: 결과 커밋
        if: always()
        env:
          IN_ACTION: ${{ inputs.action }}
          IN_PILOT: ${{ inputs.pilot }}
          IN_STAGE: ${{ inputs.stage }}
        run: |
          git add v2/pilots v2/topics.json v2/topic_media.json || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(v2): 관리자 페이지 $IN_ACTION $IN_PILOT $IN_STAGE [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && break
            sleep $((i*3))
          done
