name: deploy-stay-links

# 숙소 쇼핑쇼츠의 프로필 링크 페이지(테마 폴더) — projects/stay-shorts-factory/link/ 를 Cloudflare Pages 로 배포한다.
# 영상 CTA 가 "프로필 폴더 '11월 실내 온수풀 온천'" 을 가리키므로 발행 전에 이 페이지가 떠 있어야 한다.
# 비용 0원 (Cloudflare Pages 무료). 시크릿은 다른 배포 워크플로가 이미 쓰는 CF_API_TOKEN 만 쓴다 (새 이름 없음).
# 실행: link/** 변경 푸시, 또는 stay-shorts-produce 가 folders.json 을 갱신한 뒤 workflow_dispatch 로 부른다.

on:
  workflow_dispatch: {}
  push:
    branches: ["main", "claude/stay-shorts-factory", "claude/stay-shorts-video-conversion-67hiin"]
    paths:
      - "projects/stay-shorts-factory/link/**"
      - ".github/workflows/deploy-stay-links.yml"

concurrency:
  group: stay-links-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Pages 배포 (폴더 페이지)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            projects/stay-shorts-factory/link
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 배포할 파일 확인
        run: |
          cd projects/stay-shorts-factory/link
          test -f index.html
          python3 -c "import json;d=json.load(open('data/folders.json',encoding='utf-8'));print('폴더', len(d.get('folders',[])), '개:', [f['title'] for f in d.get('folders',[])])"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -z "$CLOUDFLARE_API_TOKEN" ] && { echo "::error::CF_API_TOKEN 시크릿이 없습니다 (다른 배포 워크플로와 같은 이름)"; exit 1; }
          cd projects/stay-shorts-factory
          # 이름 선점 대비 후보 순서대로: 프로젝트 생성(이미 있으면 무시) → 배포 성공한 이름 채택
          for NAME in stay-folders stay-links data-hocance; do
            npx --yes wrangler@4 pages project create "$NAME" --production-branch=main >/dev/null 2>&1 || true
            if npx --yes wrangler@4 pages deploy link --project-name "$NAME" --branch=main --commit-dirty=true; then
              echo "### 폴더 페이지 배포 완료: https://${NAME}.pages.dev" >> "$GITHUB_STEP_SUMMARY"
              echo "URL=https://${NAME}.pages.dev" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::warning::'${NAME}' 배포 실패 — 다음 이름 후보로 재시도"
          done
          echo "::error::모든 이름 후보 배포 실패 — CF_API_TOKEN 에 'Cloudflare Pages: Edit' 권한이 있는지 확인"
          exit 1

      - name: 텔레그램 알림
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ] && exit 0
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=폴더 페이지 배포됨: ${URL} (프로필 링크에 이 주소를 쓰세요)" || true
