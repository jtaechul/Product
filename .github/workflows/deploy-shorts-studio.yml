name: Deploy Shorts Studio

# shorts_studio/ 를 허깅페이스 Space로 올린다.
# Space는 저장소 루트에 app.py가 있어야 하므로, shorts_studio/ '안의 내용'을 Space 루트로 올린다.

# 수동 실행 전용. 허깅페이스는 Docker Space를 무료 티어에서 더 이상 호스팅하지 않는다
# (PRO 구독 필요, 402 Payment Required). PRO를 구독하면 그때 이 워크플로를 실행하면 된다.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 허깅페이스 Space 배포
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet "huggingface_hub>=0.27"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_NAME: shorts-studio
        run: python .github/scripts/deploy_hf_space.py
