name: Deploy Shorts Studio

# shorts_studio/ 를 허깅페이스 Space로 올린다.
# Space는 저장소 루트에 app.py가 있어야 하므로, shorts_studio/ '안의 내용'을 Space 루트로 올린다.

on:
  push:
    branches: ["claude/listen-and-plan-z3yryb", "main"]
    paths:
      - "shorts_studio/**"
      - ".github/workflows/deploy-shorts-studio.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 허깅페이스 Space 배포
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet "huggingface_hub>=0.27"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_NAME: shorts-studio
        run: python .github/scripts/deploy_hf_space.py
