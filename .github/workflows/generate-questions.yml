name: Generate questions (Jumplish)

# 관리자 화면의 '문제 만들어줘' 주문을 받아 초안을 만든다.
#
# 왜 여기서 도는가: 앱 서버(Cloudflare Workers)에는 AI 열쇠를 두지 않는다 —
# 운영 중 외부 호출 0회가 이 제품의 절대 규칙이다. 음원(generate-tts)·사진(generate-l1-images)이
# 이미 같은 방식으로 돌고 있어, 문항 저작도 같은 자리에 둔다.
#
# 만든 초안은 **준비 중(draft)** 으로 들어간다. 규칙집(worker/authoring.mjs)을 통과하지 못한
# 초안은 버린다. 사람이 관리자 화면에서 보고 '출제 시작'을 눌러야 아이에게 나간다.
on:
  workflow_dispatch:
    inputs:
      part:
        description: "문제 종류 (L1~L4 듣기 / R1~R3 읽기)"
        type: choice
        options: [R1, R2, R3, L1, L2, L3, L4]
        default: R3
      count:
        description: "몇 문항 (1~20)"
        default: "5"
      tag:
        description: "개념 태그 (예: RS.infer) — 비우면 자동"
        default: ""
      difficulty:
        description: "난이도 1~5 — 비우면 섞어서"
        default: ""
      note:
        description: "추가 요청 (예: 학교 급식 소재로)"
        default: ""

permissions:
  contents: write

concurrency:
  group: jumplish-genq
  cancel-in-progress: false   # 주문을 연달아 넣으면 둘 다 만들어야 한다

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    defaults:
      run:
        working-directory: junior-toeic-master
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 손대기 전 상태가 멀쩡한지 먼저 본다. 여기서 이미 깨져 있으면
      # 새 초안이 문제인지 원래 문제인지 구분할 수 없다.
      - name: Validate content (before)
        run: node tools/import.mjs --check

      - name: Generate drafts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_JUMPLISH || secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY 를 찾지 못했습니다."
            echo "::error::GitHub > Settings > Secrets and variables > Actions 의"
            echo "::error::'Repository secrets' 에 등록해 주세요 (Environment secrets 는 안 보입니다)."
            exit 1
          fi
          node tools/gen-questions.mjs \
            --part "${{ inputs.part }}" \
            --count "${{ inputs.count }}" \
            --tag "${{ inputs.tag }}" \
            --difficulty "${{ inputs.difficulty }}" \
            --note "${{ inputs.note }}"

      # 붙인 뒤에도 파일 전체가 규칙을 지키는지 다시 본다.
      # 초안 하나하나는 통과해도 파일 단위 검사(중복 이름표 등)는 여기서만 걸린다.
      - name: Validate content (after)
        run: node tools/import.mjs --check

      - name: Commit & push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/questions content/.idmap.json
          if git diff --cached --quiet; then
            echo "통과한 초안이 없어 커밋할 것이 없습니다"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "junior-toeic-master: ${{ inputs.part }} 문항 초안 ${{ inputs.count }}개 생성 (관리자 주문)" \
            -m "generate-questions.yml 에서 생성. 저작 규칙집을 통과한 초안만 준비 중(draft)으로 들어간다. 관리자 화면에서 확인하고 '출제 시작'을 눌러야 아이에게 나간다."
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "다른 작업이 먼저 푸시했습니다 — 다시 얹어 재시도 ${i}/5"
            sleep $((5 * i))
          done
          echo "::error::푸시를 5번 시도했지만 실패했습니다"
          exit 1

  # 듣기 문항이면 음원이 있어야 출제할 수 있다. 러너가 GITHUB_TOKEN 으로 한 푸시는
  # 다른 워크플로를 깨우지 못하므로(깃허브 정책) 여기서 직접 불러 준다.
  audio:
    needs: generate
    if: ${{ !cancelled() && needs.generate.outputs.pushed == 'true' && startsWith(inputs.part, 'L') }}
    uses: ./.github/workflows/generate-tts.yml
    secrets: inherit

  # 읽기 문항은 바로 배포하면 관리자 화면에 뜬다.
  # (듣기는 위 음원 워크플로가 끝나면서 배포까지 이어 준다)
  deploy:
    needs: generate
    if: ${{ !cancelled() && needs.generate.outputs.pushed == 'true' && startsWith(inputs.part, 'R') }}
    uses: ./.github/workflows/deploy-jumplish.yml
    secrets: inherit
