<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숏폼 동화 스튜디오</title>
<style>
  :root {
    --bg: #faf7f8; --card: #fff; --line: #e9e2e5; --ink: #2a2328; --dim: #8a7f86;
    --brand: #d9536f; --soft: #fdeef1; --ok: #2e9e6b; --warn: #c8871f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    word-break: keep-all; text-wrap: pretty;
  }
  header {
    position: sticky; top: 0; z-index: 20; background: var(--card);
    border-bottom: 1px solid var(--line); padding: calc(10px + env(safe-area-inset-top)) 16px 0;
  }
  h1 { margin: 0 0 8px; font-size: 18px; }
  nav { display: flex; gap: 4px; overflow-x: auto; }
  nav button {
    flex: 0 0 auto; border: 0; background: none; color: var(--dim); font-family: inherit;
    font-size: 15px; font-weight: 600; padding: 9px 12px; border-bottom: 2px solid transparent;
  }
  nav button.on { color: var(--brand); border-bottom-color: var(--brand); }
  main { padding: 16px; max-width: 620px; margin: 0 auto; }
  section { display: none; } section.on { display: block; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 14px;
  }
  h2 { margin: 0 0 12px; font-size: 16px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 6px; }
  .card > label:first-of-type { margin-top: 0; }
  input, select, textarea {
    width: 100%; padding: 12px; font-size: 16px; font-family: inherit;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
  }
  textarea { resize: vertical; }
  .btn {
    display: block; width: 100%; min-height: 50px; margin-top: 14px; border: 0;
    border-radius: 12px; background: var(--brand); color: #fff;
    font-size: 16px; font-weight: 700; font-family: inherit;
  }
  .btn:disabled { opacity: .5; }
  .btn.sub { background: var(--soft); color: var(--brand); }
  .btn.ghost { background: #f2eef0; color: var(--ink); }
  .btn.mini { width: auto; min-height: 38px; padding: 0 14px; font-size: 14px; margin: 0; }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; }
  .hint { font-size: 13px; color: var(--dim); margin: 8px 0 0; }
  .empty { color: var(--dim); font-size: 14px; text-align: center; padding: 24px 0; margin: 0; }
  .item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .item .t { font-weight: 700; font-size: 15px; }
  .item .s { font-size: 13px; color: var(--dim); margin-top: 2px; }
  .tag {
    display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px;
    border-radius: 999px; background: #f2eef0; color: var(--dim);
  }
  .tag.ok { background: #e6f5ee; color: var(--ok); }
  .tag.warn { background: #fbf1df; color: var(--warn); }
  pre {
    background: #f6f2f4; border: 1px solid var(--line); border-radius: 10px; padding: 12px;
    font-size: 13px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; margin: 0;
  }
  video { width: 100%; border-radius: 12px; background: #000; display: block; }
  .scene { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
  .bar { height: 6px; border-radius: 99px; background: #f0e9ec; overflow: hidden; margin-top: 8px; display: none; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .2s; }
  #toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom));
    background: #2a2328; color: #fff; padding: 14px 16px; border-radius: 12px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50;
  }
  #toast.show { opacity: .96; }
  #login { max-width: 420px; margin: 18vh auto 0; padding: 0 16px; }
</style>
</head>
<body>

<div id="login" hidden>
  <div class="card">
    <h2>숏폼 동화 스튜디오</h2>
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" enterkeyhint="go">
    <button class="btn" id="btnLogin">들어가기</button>
  </div>
</div>

<div id="app" hidden>
<header>
  <h1>숏폼 동화 스튜디오</h1>
  <nav>
    <button data-tab="make" class="on">① 새로 만들기</button>
    <button data-tab="work">② 작업중</button>
    <button data-tab="done">③ 완성본</button>
  </nav>
</header>

<main>
<section id="tab-make" class="on">
  <div class="card">
    <h2>주제로 대본 만들기</h2>
    <label for="topic">동화 주제</label>
    <textarea id="topic" rows="3" placeholder="예) 욕심 많은 형과 착한 아우가 나눠 가진 신기한 박씨"></textarea>
    <div class="row">
      <div>
        <label for="scenes">컷 수</label>
        <select id="scenes">
          <option>6</option><option>7</option><option selected>8</option>
          <option>9</option><option>10</option>
        </select>
      </div>
      <div>
        <label for="tool">영상 툴</label>
        <select id="tool">
          <option>Runway (Gen-3/Gen-4)</option><option>Pika</option>
          <option>Luma (Dream Machine)</option><option>Kling</option>
          <option>Sora</option><option>Veo (Google)</option>
        </select>
      </div>
    </div>
    <button class="btn" id="btnScript">대본 만들기</button>
    <p class="hint">1~2분 걸립니다. 완료되면 ② 작업중 탭에 나타납니다.</p>
  </div>
</section>

<section id="tab-work">
  <div class="card">
    <h2>작업중 <button class="btn mini ghost" id="rwork" style="float:right">새로고침</button></h2>
    <div id="workList"><p class="empty">불러오는 중...</p></div>
  </div>
  <div id="detail"></div>
</section>

<section id="tab-done">
  <div class="card">
    <h2>완성본 <button class="btn mini ghost" id="rdone" style="float:right">새로고침</button></h2>
    <div id="doneList"><p class="empty">불러오는 중...</p></div>
  </div>
</section>
</main>
</div>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let toastTimer;
function toast(msg, ms = 3400) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}
async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: "same-origin", ...opts,
    headers: { ...(opts.body && typeof opts.body === "string" ? { "Content-Type": "application/json" } : {}) } });
  const d = await r.json().catch(() => ({}));
  // 로그인 요청의 401은 "비밀번호가 틀렸다"는 뜻이다. 로그인 화면으로 되돌리면
  // 정작 틀렸다는 안내가 묻힌다.
  if (r.status === 401 && path !== "/api/login") {
    showLogin();
    throw new Error("다시 로그인해 주세요.");
  }
  if (!r.ok) throw new Error(d.error || "오류 " + r.status);
  return d;
}
async function busy(btn, fn) {
  const old = btn.textContent;
  btn.disabled = true;
  try { await fn(); }
  catch (e) { toast(e.message || String(e), 5200); }
  finally { btn.disabled = false; btn.textContent = old; }
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("복사했습니다."); }
  catch { toast("복사에 실패했습니다. 길게 눌러 직접 복사해 주세요.", 4500); }
}

/* ── 로그인 ─────────────────────────────── */
function showLogin() { $("login").hidden = false; $("app").hidden = true; }
function showApp() { $("login").hidden = true; $("app").hidden = false; }
$("btnLogin").onclick = (e) => busy(e.target, async () => {
  const pw = $("pw").value;
  if (!pw) { toast("비밀번호를 입력하세요."); return; }
  await api("/api/login", { method: "POST", body: JSON.stringify({ password: pw }) });
  $("pw").value = "";
  showApp();
  loadList();
});
$("pw").onkeydown = (e) => { if (e.key === "Enter") $("btnLogin").click(); };

/* ── 탭 ─────────────────────────────────── */
document.querySelectorAll("nav button").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll("nav button").forEach((x) => x.classList.remove("on"));
    document.querySelectorAll("section").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    $("tab-" + b.dataset.tab).classList.add("on");
    if (b.dataset.tab !== "make") loadList();
  };
});

/* ── 대본 만들기 ────────────────────────── */
$("btnScript").onclick = (e) => busy(e.target, async () => {
  const topic = $("topic").value.trim();
  if (!topic) { toast("동화 주제를 입력하세요."); return; }
  e.target.textContent = "보내는 중...";
  await api("/api/script", { method: "POST", body: JSON.stringify({
    topic, scenes: $("scenes").value, tool: $("tool").value }) });
  $("topic").value = "";
  toast("대본을 만들고 있습니다. 1~2분 뒤 ② 작업중 탭에서 새로고침해 주세요.", 6000);
});

/* ── 목록 ───────────────────────────────── */
let items = [];
async function loadList() {
  $("workList").innerHTML = '<p class="empty">불러오는 중...</p>';
  $("doneList").innerHTML = '<p class="empty">불러오는 중...</p>';
  try {
    items = (await api("/api/list")).items || [];
  } catch (e) { toast(e.message, 5200); return; }
  render("work"); render("done");
}
$("rwork").onclick = loadList;
$("rdone").onclick = loadList;

function render(which) {
  const box = which === "work" ? $("workList") : $("doneList");
  if (which === "work") $("detail").innerHTML = "";
  const mine = items.filter((r) => which === "done" ? r.status === "rendered" : r.status !== "rendered");
  if (!mine.length) {
    box.innerHTML = `<p class="empty">${which === "done" ? "아직 완성된 영상이 없습니다." : "작업중인 작품이 없습니다."}</p>`;
    return;
  }
  box.innerHTML = "";
  mine.forEach((rec) => box.appendChild(which === "done" ? doneCard(rec) : workCard(rec)));
}

function workCard(rec) {
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = `<div class="t"></div><div class="s"></div>
    <button class="btn mini sub" style="margin-top:10px">열기</button>`;
  el.querySelector(".t").textContent = rec.title || rec.topic;
  el.querySelector(".s").textContent = `${rec.scenes.length}컷 · ${rec.tool}`;
  el.querySelector("button").onclick = (e) => busy(e.target, () => openDetail(rec));
  return el;
}

function doneCard(rec) {
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = `<div class="t"></div><div class="s"></div>
    <video controls playsinline preload="metadata" style="margin-top:10px"></video>
    <button class="btn mini ghost" style="margin-top:10px">원본 내려받기</button>`;
  el.querySelector(".t").textContent = rec.title || rec.topic;
  el.querySelector(".s").textContent =
    `${rec.duration || "?"}초 · ${rec.resolution || ""} · ${(rec.hashtags || []).join(" ")}`;
  el.querySelector("video").src = "/api/video?u=" + encodeURIComponent(rec.video);
  el.querySelector("button").onclick = () => window.open(rec.video, "_blank");
  return el;
}

/* ── 상세: 프롬프트 복사 + 씬 영상 올리기 + 렌더링 ── */
function upload(file, id, n, bar) {
  // 진행률을 보여주려면 XHR이 필요하다(fetch는 업로드 진행률을 알려주지 않는다).
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", `/api/upload?id=${encodeURIComponent(id)}&scene=${n}`);
    x.withCredentials = true;
    x.upload.onprogress = (ev) => {
      if (!ev.lengthComputable) return;
      bar.style.display = "block";
      bar.firstElementChild.style.width = Math.round(ev.loaded / ev.total * 100) + "%";
    };
    x.onload = () => {
      bar.style.display = "none";
      let d = {};
      try { d = JSON.parse(x.responseText); } catch (_) {}
      if (x.status >= 200 && x.status < 300) resolve(d);
      else reject(new Error(d.error || "업로드 실패 " + x.status));
    };
    x.onerror = () => { bar.style.display = "none"; reject(new Error("업로드 중 연결이 끊겼습니다.")); };
    x.send(file);
  });
}

async function openDetail(rec) {
  const box = $("detail");
  box.innerHTML = '<div class="card"><p class="empty">불러오는 중...</p></div>';
  const up = await api("/api/uploaded?id=" + encodeURIComponent(rec.id));
  const have = new Set(up.scenes || []);

  const card = document.createElement("div");
  card.className = "card";
  const h = document.createElement("h2");
  h.textContent = rec.title || rec.topic;
  card.appendChild(h);
  const note = document.createElement("p");
  note.className = "hint";
  note.style.marginTop = "0";
  note.textContent = rec.tool_note || "";
  card.appendChild(note);

  // ── 인물 참조 이미지 ──
  // 씬마다 영상 AI가 따로 그리면 인물이 매번 달라진다. 기준 이미지 한 장을 만들어
  // 모든 씬에 함께 넣는 것이 유일하게 확실한 방법이다. 그래서 씬 프롬프트에는
  // 외모를 한 글자도 넣지 않는다(글과 이미지가 싸우면 컷마다 인물이 바뀐다).
  // 등장인물이 여럿이면 사람마다 한 장씩. 옛 기록(인물 한 명)도 그대로 읽는다.
  const cast = (rec.characters && rec.characters.length)
    ? rec.characters
    : (rec.character_image_prompt
        ? [{ name: rec.character_name || "주인공", role: "",
             image_prompt: rec.character_image_prompt }]
        : []);
  const upChars = up.characters || [up.character || null];

  cast.forEach((c, ci) => {
    const n = ci + 1;
    const ch = document.createElement("div");
    ch.className = "scene";
    ch.innerHTML = `
      <div style="font-weight:700">인물 ${n} · <span class="nm"></span> <span class="tag"></span></div>
      <p class="hint" style="margin:6px 0 8px"></p>
      <img alt="" style="display:none;width:46%;border-radius:10px;margin-bottom:10px">
      <pre></pre>
      <div class="row" style="margin-top:10px">
        <button class="btn mini sub">이미지 프롬프트 복사</button>
        <button class="btn mini ghost">기준 이미지 올리기</button>
      </div>
      <div class="bar"><i></i></div>
      <input type="file" accept="image/png,image/jpeg,.png,.jpg,.jpeg" hidden>`;
    ch.querySelector(".nm").textContent = c.name || "주인공";
    ch.querySelector(".hint").textContent = (c.role ? c.role + " — " : "")
      + "이 그림이 이 인물의 기준입니다. 이 사람이 나오는 씬 영상을 만들 때 영상 툴의 참조 이미지 칸에 매번 같이 넣어 주세요.";
    ch.querySelector("pre").textContent = c.image_prompt || "(이미지 프롬프트가 없습니다)";

    const chTag = ch.querySelector(".tag");
    const chImg = ch.querySelector("img");
    const markCh = (urlOrNull) => {
      chTag.textContent = urlOrNull ? "준비됨" : "필요함";
      chTag.className = "tag " + (urlOrNull ? "ok" : "warn");
      if (urlOrNull) {
        chImg.src = "/api/video?u=" + encodeURIComponent(urlOrNull);
        chImg.style.display = "block";
      }
    };
    markCh(upChars[ci]);

    const [bCopy, bUp] = ch.querySelectorAll("button");
    const bar = ch.querySelector(".bar");
    const file = ch.querySelector("input");
    bCopy.onclick = () => copy(c.image_prompt || "");
    bUp.onclick = () => file.click();
    file.onchange = () => busy(bUp, async () => {
      const f = file.files[0];
      file.value = "";
      if (!f) return;
      bUp.textContent = "올리는 중...";
      await upload(f, rec.id, "char" + n, bar);
      const again = await api("/api/uploaded?id=" + encodeURIComponent(rec.id));
      markCh((again.characters || [])[ci]);
      toast(`${c.name || "인물"} 기준 이미지를 올렸습니다.`);
    });
    card.appendChild(ch);
  });

  rec.scenes.forEach((sc, i) => {
    const n = i + 1;
    const w = document.createElement("div");
    w.className = "scene";
    w.innerHTML = `
      <div style="font-weight:700">${n}번 씬 <span class="len"></span> <span class="tag st"></span></div>
      <p class="hint" style="margin:6px 0 8px"></p>
      <pre></pre>
      <div class="row" style="margin-top:10px">
        <button class="btn mini sub">프롬프트 복사</button>
        <button class="btn mini ghost">영상 올리기</button>
      </div>
      <div class="bar"><i></i></div>
      <input type="file" accept="video/mp4,video/quicktime,.mp4,.mov" hidden>`;
    // 몇 초짜리를 만들어야 하는지 바로 보이게 한다. 짧으면 마지막 프레임이 얼어붙고
    // 길면 잘린다. 한 번 렌더한 뒤에는 실제로 잰 값이 표시된다.
    const secs = sc.actual_seconds || sc.est_seconds;
    const lenEl = w.querySelector(".len");
    if (secs) {
      lenEl.className = "tag len" + (secs > 10 ? " warn" : "");
      lenEl.textContent = (sc.actual_seconds ? "" : "약 ") + secs + "초"
        + (secs > 10 ? " · 너무 김" : "");
    }
    const tag = w.querySelector(".st");
    const mark = (yes) => {
      tag.textContent = yes ? "영상 있음" : "영상 필요";
      tag.className = "tag " + (yes ? "ok" : "warn");
    };
    mark(have.has(n));
    // 이 씬에 누가 나오는지 = 어떤 기준 이미지를 참조 칸에 넣어야 하는지.
    w.querySelector(".hint").textContent =
      (sc.cast && sc.cast.length ? "[참조 이미지: " + sc.cast.join(", ") + "] " : "")
      + (sc.shot ? "[" + sc.shot + "] " : "") + sc.narration;
    w.querySelector("pre").textContent = sc.prompt + (sc.negative ? "\n\n[네거티브] " + sc.negative : "");
    const [btnCopy, btnUp] = w.querySelectorAll("button");
    const bar = w.querySelector(".bar");
    const file = w.querySelector("input");
    btnCopy.onclick = () => copy(sc.prompt);
    btnUp.onclick = () => file.click();
    file.onchange = () => busy(btnUp, async () => {
      const f = file.files[0];
      file.value = "";
      if (!f) return;
      btnUp.textContent = "올리는 중...";
      await upload(f, rec.id, n, bar);
      mark(true);
      toast(`${n}번 씬 영상을 올렸습니다.`);
    });
    card.appendChild(w);
  });

  const opts = document.createElement("div");
  opts.className = "scene";
  opts.innerHTML = `
    <label>성우 (감정 연기)</label>
    <select class="v">
      <option value="Sulafat">술라팟 (여성 · 따뜻하고 포근함 · 추천)</option>
      <option value="Kore">코레 (여성 · 또렷하고 단단함)</option>
      <option value="Aoede">아오이데 (여성 · 가볍고 산뜻함)</option>
      <option value="Leda">레다 (여성 · 앳되고 발랄함)</option>
      <option value="Charon">카론 (남성 · 차분한 이야기꾼)</option>
      <option value="Enceladus">엔켈라두스 (남성 · 낮고 숨결 섞인 톤)</option>
    </select>
    <div class="row">
      <div><label>자막 색</label>
        <select class="h"><option>노란색</option><option>연두색</option><option>하늘색</option><option>분홍색</option></select></div>
      <div><label>화질</label>
        <select class="q"><option value="false">720 (빠름)</option><option value="true">1080 (느림)</option></select></div>
    </div>
    <button class="btn">최종 영상 만들기</button>
    <p class="hint">모든 씬 영상을 올린 뒤 눌러 주세요. 3~10분 뒤 ③ 완성본 탭에 나타납니다.</p>`;
  opts.querySelector("button").onclick = (e) => busy(e.target, async () => {
    e.target.textContent = "보내는 중...";
    await api("/api/render", { method: "POST", body: JSON.stringify({
      id: rec.id, count: rec.scenes.length,
      voice: opts.querySelector(".v").value,
      highlight: opts.querySelector(".h").value,
      hq: opts.querySelector(".q").value,
    }) });
    toast("영상을 만들고 있습니다. 3~10분 뒤 ③ 완성본 탭을 새로고침해 주세요.", 6500);
  });
  card.appendChild(opts);

  box.innerHTML = "";
  box.appendChild(card);
  card.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ── 시작 ───────────────────────────────── */
fetch("/api/me", { credentials: "same-origin" })
  .then((r) => { if (r.ok) { showApp(); loadList(); } else showLogin(); })
  .catch(showLogin);
</script>
</body>
</html>
